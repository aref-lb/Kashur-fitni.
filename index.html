<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kashur Fitni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#15121c;--ink:#f6efe2;--saffron:#f0a830;--chinar:#d9482b;--lake:#3d8ca8;--panel:#241f2e;--line:#3a3347;--font:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0d0b12;overflow:hidden}
#c{display:block}
#voice{position:absolute;left:50%;top:max(72px,10vh);transform:translateX(-50%) translateY(-8px);z-index:30;display:none;max-width:min(760px,86vw);padding:10px 18px;border:2px solid #ffe39a;border-radius:18px;background:rgba(18,12,24,.94);color:#fff3c7;font:800 clamp(14px,3vh,22px) var(--font);line-height:1.12;text-align:center;text-shadow:0 2px 0 #39220c;box-shadow:0 5px 18px rgba(0,0,0,.45);pointer-events:none}
#voice.on{display:block;animation:voiceIn .16s ease-out}
@keyframes voiceIn{from{opacity:0;transform:translateX(-50%) translateY(-18px)}to{opacity:1;transform:translateX(-50%) translateY(-8px)}}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.6vh,12px);text-align:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.scr.on{display:flex}
#title{background:radial-gradient(ellipse at center,rgba(12,9,18,.25),rgba(12,9,18,.78))}
#select,#result,#pause{background:rgba(12,9,18,.84)}
h1{margin:0;font-weight:800;font-size:clamp(34px,13vh,92px);line-height:.95;letter-spacing:.02em;color:#fff3dc;text-shadow:0 4px 0 var(--chinar),0 8px 22px rgba(0,0,0,.55)}
h1 span{color:var(--saffron)}
h2{margin:0;font-weight:800;font-size:clamp(20px,6vh,38px);letter-spacing:.04em;text-wrap:balance}
.sub{margin:0;font-size:clamp(12px,3.2vh,19px);opacity:.88;text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:800 clamp(16px,4.4vh,26px) var(--font);padding:.3em 1.5em;border:0;border-radius:12px;background:var(--saffron);color:#2a1b05;box-shadow:0 4px 0 #9c6410;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9c6410}
.btn.alt{background:#3a3347;color:var(--ink);box-shadow:0 4px 0 #1f1a28}
.btn:disabled{opacity:.4;pointer-events:none}
.btn:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cards{display:flex;gap:clamp(6px,1.6vw,14px);justify-content:center;align-items:stretch}
.card{width:clamp(88px,20vw,150px);padding:6px 4px 8px;border-radius:14px;border:3px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;touch-action:manipulation;transition:transform .12s,border-color .12s}
.card canvas{width:clamp(64px,17vh,110px);aspect-ratio:4/5;height:auto}
.card b{font-size:clamp(12px,3.4vh,18px);line-height:1.05}
.card i{font-style:normal;font-size:clamp(10px,2.6vh,13px);opacity:.75}
.card.sel{border-color:var(--saffron);transform:translateY(-4px);background:#35283a}
.boss{color:var(--chinar);font-weight:800}
#info{min-height:2.6em;font-size:clamp(11px,3vh,16px);max-width:min(640px,92vw);line-height:1.15}
#info b{color:var(--saffron)}
#ctl{position:absolute;inset:0;display:none;pointer-events:none;z-index:4}
#ctl.on{display:block}
.pad{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,0px));display:grid;gap:clamp(6px,1.6vh,12px);pointer-events:none}
.pad.L{left:max(16px,env(safe-area-inset-left,0px));grid-template-columns:repeat(2,auto)}
.pad.R{right:max(16px,env(safe-area-inset-right,0px));grid-template-columns:repeat(3,auto)}
#ctl button{pointer-events:auto;touch-action:none;width:clamp(50px,17vh,78px);height:clamp(50px,17vh,78px);border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(20,16,28,.42);color:#fff;font:800 clamp(10px,2.8vh,15px) var(--font);letter-spacing:.02em;backdrop-filter:blur(2px)}
#ctl button.dn{background:rgba(240,168,48,.7);border-color:#fff;transform:scale(.94)}
#ctl .up{grid-column:1/3;justify-self:center}
#ctl .p2{grid-column-start:2}
#ctl #bu.rdy{background:rgba(217,72,43,.8);border-color:#ffe39a;animation:pls .5s infinite alternate}
@keyframes pls{to{transform:scale(1.1)}}
#ctl #pz{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:42px;height:42px;font-size:15px}
#rot{position:absolute;inset:0;z-index:20;background:#15121c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#rot .ph{width:54px;height:92px;border:4px solid var(--saffron);border-radius:10px;animation:rt 1.6s ease-in-out infinite}
@keyframes rt{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,6,20,.45))}
.btn.dbtn{font-size:clamp(12px,3.4vh,20px);padding:.3em 1em}.btn.dbtn.sel{background:var(--saffron);color:#2a1b05;box-shadow:0 4px 0 #9c6410}
#ctl #mu{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 52px);width:42px;height:42px;font-size:15px}
@media (orientation:portrait){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){#rot .ph,#ctl #bu.rdy{animation:none}}
</style>
</head><body>
<div id="app">
 <canvas id="c"></canvas>
 <div id="voice" aria-live="polite"></div>
 <div id="title" class="scr on">
  <h1>KASHUR<br><span>FITNI</span></h1>
  <p class="sub">Fight it out at the Dal. Beat three rivals, then face the boss.</p>
  <button class="btn" id="bStart">START</button>
  <div class="row"><button class="btn alt" id="bFs" style="font-size:clamp(12px,3vh,16px)">Full screen</button><button class="btn alt" id="bMu" style="font-size:clamp(12px,3vh,16px)">&#9834; Music: ON</button></div>
 </div>
 <div id="select" class="scr">
  <h2>CHOOSE YOUR FIGHTER</h2>
  <div class="cards" id="cards"></div>
  <div id="info"></div>
  <div class="row"><button class="btn alt" id="bBack">BACK</button><button class="btn dbtn" data-d="easy">EASY</button><button class="btn dbtn" data-d="medium">MEDIUM</button><button class="btn dbtn" data-d="hard">HARD</button><button class="btn" id="bFight" disabled>FIGHT</button></div>
 </div>
 <div id="result" class="scr">
  <h2 id="rTitle"></h2>
  <p class="sub" id="rSub"></p>
  <div class="row"><button class="btn" id="bNext"></button><button class="btn alt" id="bSel">CHARACTER SELECT</button></div>
 </div>
 <div id="pause" class="scr">
  <h2>PAUSED</h2>
  <div class="row"><button class="btn" id="bRes">RESUME</button><button class="btn alt" id="bQuit">QUIT</button></div>
 </div>
 <div id="ctl">
  <div class="pad L"><button data-k="j" class="up">JUMP</button><button data-k="l">&#9664;</button><button data-k="r">&#9654;</button></div>
  <div class="pad R"><button data-k="b">BLOCK</button><button data-k="s">SPECIAL</button><button data-k="u" id="bu">SUPER</button><button data-k="p" class="p2">PUNCH</button><button data-k="k">KICK</button></div>
  <button id="mu" aria-label="Music">&#9834;</button><button id="pz" aria-label="Pause">II</button>
 </div>
 <div id="rot"><div class="ph"></div><h2>Rotate your phone</h2><p class="sub">Kashur Fitni is played in landscape.</p></div>
</div>
<script>
(()=>{
'use strict';
const W=800,H=400,GY=338,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d',{alpha:false,desynchronized:true});
const bgc=document.createElement('canvas'),bgx=bgc.getContext('2d'),fgc=document.createElement('canvas'),fgx=fgc.getContext('2d');
const lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const FONT='"Baloo 2",system-ui,sans-serif';
const CH=[
 {id:'daand',name:'Daand',tag:'The Bull',hp:100,spd:2.7,sp:'Shoulder Charge',su:'Bull Rampage',col:'#c9b27c',bio:'Grumpy elder with a heavy shoulder. When his super is full he turns into a charging bull.'},
 {id:'kaani',name:'Kaani Ceat',tag:'Quick Striker',hp:90,spd:3.1,sp:'Quick Kick',su:'Pellet Gun',col:'#e8a93a',bio:'Quick and sly. She fights hand-to-hand and saves her pellet gun for a fully charged super.'},
 {id:'ali',name:'OG Ali Sahab',tag:'Boss',hp:130,spd:2.1,sp:'Kangri Kahar',su:'Chinar Storm',col:'#8d8478',bio:'Calm and heavy. Kangri embers slow you down, chinar leaves heal him.'},
 {id:'wazul',name:'Kaina Ji',tag:'Lotus Warrior',hp:100,spd:2.9,sp:'Lotus Strike',su:'Lotus Emblem',col:'#2f9a9a',bio:'A disciplined lotus warrior whose special becomes a spinning flower strike and whose super reveals a bold layered lotus emblem.'}
];
const PAL={
 daand:{skin:'#e3ae8a',top:'#f1ede4',sleeve:'#f1ede4',pants:'#3d4148',shoe:'#1f2127'},
 kaani:{skin:'#c8906a',top:'#17366f',sleeve:'#17366f',pants:'#112b5b',shoe:'#1f2127'},
 ali:{skin:'#d9a07a',top:'#4b4640',sleeve:'#4b4640',pants:'#37352f',shoe:'#1f2127'},
 wazul:{skin:'#d8a07c',top:'#e98225',sleeve:'#e98225',pants:'#efe6cc',shoe:'#1f2127'}
 };
 const VOICE_LINES={
  kaani:{start:'Moun moul ous jannat gaar',hit:'Hata paye tawan',special:'Hoo tafa gasak na yatis',super:'Hoo tafa gasak na yatis'},
  daand:{start:'Husband choose kiya hai?',hit:'Hatai 200 unit mufut power',special:'Rooun chuya choose kurmut?',super:'Rooun chuya choose kurmut?'},
  ali:{start:'Jumuriyat ka jinaza nikal gaya',hit:'Doun dohan gaye schoolan chuti',special:'Kangri dab walai fanna gasak',super:'Kangri dab walai fanna gasak'},
  wazul:{start:'Modi modi',hit:'NC aur PDP choor hai',special:'Kashmir hamarai hai',super:'Kashmir hamarai hai'}
 };
 let voiceTimer=0;
 function voiceLine(id,kind){
  const text=VOICE_LINES[id]&&VOICE_LINES[id][kind];
  if(!text)return;
  const v=$('voice'),speaker=(CH.find(c=>c.id===id)||{name:id}).name;v.textContent=speaker+': '+text;v.classList.remove('on');void v.offsetWidth;v.classList.add('on');clearTimeout(voiceTimer);voiceTimer=setTimeout(()=>v.classList.remove('on'),5200);
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);u.rate=.92;u.pitch=id==='wazul'?1.02:id==='daand'?.82:1;u.volume=.95;window.speechSynthesis.speak(u);
 }
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();}
function limb(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function dot(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function ell(c,x,y,rx,ry,col,rot){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);c.fill();}
const ez=t=>t*t*(3-2*t);
function poly(c,p){c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();}

/* ---------- background: Kashmir playground at the Dal ---------- */
function mount(c,pts,col,y0,y1){
 poly(c,pts);c.fillStyle=col;c.fill();
 const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#f7fafd');g.addColorStop(.55,'rgba(247,250,253,.9)');g.addColorStop(1,'rgba(247,250,253,0)');
 poly(c,pts);c.fillStyle=g;c.fill();
}
function tree(c,x,y,s,a,b){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#5a3a24';c.fillRect(-5,-34,10,34);
 [[0,-58,28,a],[-20,-44,21,b],[20,-44,21,b],[-8,-74,19,b],[12,-70,17,a]].forEach(q=>dot(c,q[0],q[1],q[2],q[3]));c.restore();}
function shikara(c,x,y,s,can){
 c.save();c.translate(x,y);c.scale(s,s);
 ell(c,0,7,76,5,'rgba(10,40,60,.28)');
 c.fillStyle='#6b3f1f';c.beginPath();c.moveTo(-78,-18);c.quadraticCurveTo(-62,5,-30,6);c.lineTo(42,6);c.quadraticCurveTo(68,4,82,-22);c.quadraticCurveTo(52,-8,30,-9);c.lineTo(-34,-9);c.quadraticCurveTo(-60,-9,-78,-18);c.fill();
 c.fillStyle='#8a5a30';c.fillRect(-60,-3,110,3);
 c.fillStyle='#3a2420';c.fillRect(-36,-34,72,26);
 c.fillStyle='#e9d4a0';c.fillRect(-32,-14,64,7);
 c.strokeStyle='#4a2a12';c.lineWidth=3;[-38,-12,14,38].forEach(px=>{c.beginPath();c.moveTo(px,-9);c.lineTo(px,-44);c.stroke();});
 c.fillStyle=can;rr(c,-46,-54,92,16,6);
 c.fillStyle='rgba(255,255,255,.35)';for(let i=-40;i<40;i+=16)c.fillRect(i,-54,7,16);
 c.fillStyle=can;for(let i=-44;i<46;i+=11){c.beginPath();c.moveTo(i,-38);c.lineTo(i+11,-38);c.lineTo(i+5.5,-31);c.closePath();c.fill();}
 limb(c,64,-10,96,-42,3,'#4a2a12');c.restore();
}
function drawBg(c){
 let g=c.createLinearGradient(0,0,0,190);g.addColorStop(0,'#6fb0da');g.addColorStop(1,'#eaf1f3');c.fillStyle=g;c.fillRect(0,0,W,200);
 g=c.createRadialGradient(650,64,4,650,64,130);g.addColorStop(0,'rgba(255,246,218,.95)');g.addColorStop(1,'rgba(255,246,218,0)');c.fillStyle=g;c.fillRect(0,0,W,200);
 mount(c,[[-20,196],[60,98],[116,132],[200,52],[292,142],[364,98],[452,150],[544,66],[624,132],[704,82],[820,150],[820,196]],'#8aa2c2',46,138);
 mount(c,[[-20,196],[40,138],[130,104],[232,152],[330,122],[432,162],[524,124],[640,154],[736,114],[820,152],[820,196]],'#657fa3',100,168);
 c.fillStyle='#46604f';for(let x=-10;x<820;x+=14){const h=16+((x*37)%11);c.beginPath();c.moveTo(x,196);c.lineTo(x+7,196-h);c.lineTo(x+14,196);c.fill();}
 g=c.createLinearGradient(0,190,0,276);g.addColorStop(0,'#5ea6b8');g.addColorStop(1,'#2c6f86');c.fillStyle=g;c.fillRect(0,190,W,86);
 c.fillStyle='rgba(255,255,255,.14)';for(let i=0;i<26;i++){const x=(i*97)%W,y=198+((i*53)%70);c.fillRect(x,y,30+(i%4)*14,2);}
 }
function drawFg(c){let g;
 g=c.createLinearGradient(0,270,0,306);g.addColorStop(0,'#86b255');g.addColorStop(1,'#5d8a3b');c.fillStyle=g;c.fillRect(0,272,W,36);
 [[30,292,1.05],[140,290,.8],[330,290,.9],[520,290,.75],[690,292,1.1],[775,290,.85]].forEach((t,i)=>tree(c,t[0],t[1],t[2],i%2?'#d9822b':'#c8452b',i%2?'#c8452b':'#e0a03a'));
 c.fillStyle='#7a4a25';c.fillRect(0,298,W,4);c.fillRect(0,308,W,4);
 for(let x=6;x<W;x+=26){c.fillStyle='#8c5a2c';c.fillRect(x,293,6,26);}
 g=c.createLinearGradient(0,312,0,H);g.addColorStop(0,'#d6b27a');g.addColorStop(1,'#b08550');c.fillStyle=g;c.fillRect(0,312,W,H-312);
 c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=3;c.beginPath();c.ellipse(400,372,300,30,0,0,TAU);c.stroke();
 c.beginPath();c.moveTo(400,344);c.lineTo(400,400);c.stroke();
 c.fillStyle='rgba(70,45,20,.12)';for(let i=0;i<40;i++)c.fillRect((i*131)%W,320+((i*47)%76),6+(i%3)*4,2);
}

/* ---------- fighters ---------- */
function drawChar(c,f,ox,oy){
 c.save();c.translate(ox,oy);c.scale((f.fs===undefined?f.face:f.fs)*(1+(f.sq||0)*.1),1.1-(f.sq||0)*.12);
 if(f.form==='bull')drawBull(c,f);else if(f.form==='lotus')drawLotus(c,f);else drawHuman(c,f);
 c.restore();
}
function drawHuman(c,f){
 const id=f.ch.id,P=PAL[id],a=ez(f.arm),k=ez(f.leg),air=f.air,w=f.moving?Math.sin(f.walk):0;
 if(f.st==='ko'){c.translate(-26,0);c.rotate(-1.35);}
 else if(f.st==='hit')c.rotate(-.13);
 else if(f.st==='idle'&&!f.block)c.translate(0,Math.sin(f.tick*.09)*1.2);
 const hy=-50,long=id==='ali';
 // legs
 const bx=air?-4:-8-w*9,by=air?-18:-2;
 limb(c,-6,hy,bx,by-4,14,P.pants);ell(c,bx+2,by,11,5,P.shoe);
 const fx=air?12:9+w*9+k*50,fy=air?-22:-3-k*38;
 limb(c,6,hy,fx,fy-4,14,P.pants);ell(c,fx+3,fy,11,5,P.shoe);
 // back arm
 const blk=f.block,action=f.st==='atk'||f.st==='special'||f.st==='super';
 const bax=blk?12:action?-34:-22,bay=blk?-110:action?-84:-66;
 limb(c,-15,-94,bax,bay,12,P.sleeve);dot(c,bax,bay,7,P.skin);
 // torso
 c.fillStyle=P.top;rr(c,-20,-103,40,long?80:54,9);
 if(id==='daand'){c.fillStyle='#5f6670';rr(c,-20,-103,13,54,5);rr(c,7,-103,13,54,5);}
 if(id==='kaani'){c.fillStyle='#e5c786';c.fillRect(-4,-103,8,54);c.fillStyle='#244b91';poly(c,[[-20,-104],[20,-104],[14,-93],[0,-98],[-14,-93]]);c.fill();}
 if(id==='wazul'){c.fillStyle='#c95e18';c.fillRect(-3,-103,6,20);c.fillStyle='#ffd36b';for(let i=0;i<8;i++){const an=i*TAU/8;const px=Math.cos(an)*8,py=-82+Math.sin(an)*8;c.save();c.translate(px,py);c.rotate(an);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-5,-8,0,-13);c.quadraticCurveTo(5,-8,0,0);c.fill();c.restore();}dot(c,0,-82,4,'#9c431c');}
 if(id==='ali'){c.fillStyle='#8c8272';poly(c,[[-9,-103],[9,-103],[0,-84]]);c.fill();c.fillStyle='#7a6f60';c.fillRect(-20,-30,40,3);
  c.fillStyle='#3f3e42';c.fillRect(-21,-104,10,56);c.fillRect(11,-104,10,52);c.fillStyle='#8b8a8f';for(let y=-96;y<-52;y+=9){c.fillRect(-21,y,10,1.5);c.fillRect(11,y,10,1.5);}
  c.fillStyle='#2b2a2c';for(let i=0;i<4;i++){c.fillRect(-20+i*2.5,-49,1.5,8);c.fillRect(12+i*2.5,-52,1.5,8);}}
 // head
 ell(c,-16,-120,4.5,6,'#c98f6c');ell(c,20,-120,4.5,6,'#c98f6c');dot(c,2,-120,18,P.skin);
 const brow=id==='daand'?'#eef0f2':id==='ali'?'#c3c3c8':'#2a1f1a',bw=id==='daand'?5:3.4;
 if(id==='kaani'){c.fillStyle='#12264f';c.beginPath();c.moveTo(-20,-119);c.quadraticCurveTo(-22,-151,2,-153);c.quadraticCurveTo(28,-149,25,-119);c.lineTo(19,-101);c.lineTo(10,-111);c.lineTo(-10,-108);c.lineTo(-20,-96);c.closePath();c.fill();c.strokeStyle='#e5c786';c.lineWidth=2;c.beginPath();c.moveTo(-14,-147);c.quadraticCurveTo(-2,-154,14,-148);c.stroke();}
 if(id==='wazul'){c.fillStyle='#2a201b';c.beginPath();c.arc(2,-124,19,Math.PI,0);c.fill();[[-13,-136],[-3,-141],[8,-141],[18,-135]].forEach(q=>dot(c,q[0],q[1],8,'#2a201b'));}

const screens=['title','select','result','pause'];
function show(id){screens.forEach(s=>$(s).classList.toggle('on',s===id));$('ctl').classList.toggle('on',id==='fight');}
function buildLadder(){
 const o=CH.filter(c=>c!==G.player).sort(()=>Math.random()-.5);
 o.sort((a,b)=>(a.id==='ali')-(b.id==='ali'));return o;
}
function startRun(){G.ladder=buildLadder();G.stage=0;startMatch();}
function startMatch(){
 F1=mk(G.player,-1,false);F2=mk(G.ladder[G.stage],1,true);F2.lvl=Math.max(.2,Math.min(4,.8+G.stage*.9+DF[DIFF].lv));F2.max=Math.round(F2.ch.hp*DF[DIFF].hp);
 if(F2.ch.id==='ali'&&G.stage>0)F2.lvl+=.2;

}
function startRound(){
  [F1,F2].forEach((f,i)=>{f.x=i?560:240;f.y=0;f.vy=0;f.vx=0;f.hp=f.max;f.lag=f.max;f.meter=0;f.st='idle';f.t=0;f.arm=0;f.leg=0;f.form='human';f.air=false;f.cd=0;f.slow=0;f.atk=null;f.cap='';f.capT=0;f.face=i?-1:1;f.fs=f.face;f.aiT=0;f.p=null;f.mv=0;f.sq=0;});

}
function endRound(){
 let w=null;
 if(F1.hp<=0&&F2.hp<=0)w=null;else if(F2.hp<=0)w=F1;else if(F1.hp<=0)w=F2;
 else{const a=F1.hp/F1.max,b=F2.hp/F2.max;w=a>b?F1:b>a?F2:null;}
 G.win=w;G.banner=G.timer<=0&&F1.hp>0&&F2.hp>0?'TIME UP':'K.O.';
 if(w===F1)rpw++;else if(w===F2)rpl++;
 G.mode='ko';G.bt=0;
}
function afterRound(){
 if(rpw>=2||rpl>=2){matchOver(rpw>=2);return;}
 G.round++;startRound();
}
function matchOver(won){
 G.mode='over';show('result');
 const last=G.stage>=G.ladder.length-1,opp=G.ladder[G.stage];
 if(won&&last){$('rTitle').textContent='CHAMPION!';$('rSub').textContent='You beat every rival at the Dal.';$('bNext').textContent='PLAY AGAIN';$('bNext').dataset.a='again';}
 else if(won){$('rTitle').textContent='YOU WIN';$('rSub').textContent='Next up: '+G.ladder[G.stage+1].name+(G.ladder[G.stage+1].id==='ali'?' (BOSS)':'');$('bNext').textContent='NEXT FIGHT';$('bNext').dataset.a='next';}
 else{$('rTitle').textContent='DEFEATED';$('rSub').textContent=opp.name+' won this one.';$('bNext').textContent='REMATCH';$('bNext').dataset.a='re';}
}
function update(){
 G.frame++;if(G.paused)return;
 if(F1&&F2)[F1,F2].forEach(snap);
 if(G.mode==='intro'){
  G.bt++;F1.tick++;F2.tick++;if(G.bt>=112){G.mode='fight';}
  return;
 }
 if(G.mode!=='fight'&&G.mode!=='ko')return;
  if(G.stop>0){G.stop--;G.superCue=Math.max(0,G.superCue-1);return;}
  if(G.superCue>0)G.superCue--;
 G.shake*=.85;
 if(G.mode==='fight'){
  const i1={l:keys.l,r:keys.r,b:keys.b,j:press.j>0,p:press.p>0,k:press.k>0,s:press.s>0,u:press.u>0},s0=F1.st,a0=F1.air;

  G.flash=Math.max(0,(G.flash||0)-1);
  separate();stepProj();
  G.timer--;
  [F1,F2].forEach(f=>{f.lag=f.lag>f.hp?Math.max(f.hp,f.lag-.5):f.hp;});
  if(F1.hp<=0||F2.hp<=0||G.timer<=0)endRound();

  G.bt++;stepFighter(F1,F2,{});stepFighter(F2,F1,{});stepProj();

}

 });
 KANI_REF.onload=()=>cardEls.forEach((e,i)=>portrait(e.querySelector('canvas'),CH[i]));KANI_REF.src='44852.png';
 function goSelect(){G.mode='select';G.paused=false;F1=F2=null;show('select');$('pause').classList.remove('on');
 if(!G.pick)$('info').textContent='Tap a fighter. Beat three rivals, the boss comes last.';}

document.querySelectorAll('.dbtn').forEach(b=>b.onclick=()=>setD(b.dataset.d));setD(DIFF);
$('bMu').onclick=()=>{audioInit();setMute();};
$('mu').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();setMute();});
addEventListener('pointerdown',e=>{audioInit();if(e.target.closest&&e.target.closest('.btn,.card'))sfx('ui');},true);
addEventListener('keydown',()=>audioInit(),true);
document.addEventListener('visibilitychange',()=>{if(!AU.c)return;if(document.hidden)AU.c.suspend();else if(!AU.mute)AU.c.resume();});
$('bBack').onclick=()=>{G.mode='menu';show('title');};
$('bFight').onclick=()=>{G.player=G.pick;if(G.player)startRun();};
$('bSel').onclick=goSelect;
$('bNext').onclick=()=>{const a=$('bNext').dataset.a;
 if(a==='next'){G.stage++;startMatch();}else if(a==='re')startMatch();else startRun();};
$('bFs').onclick=()=>{try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d);}catch(_){}};
addEventListener('resize',resize);
resize();show('title');
requestAnimationFrame(t=>{last=t;loop(t);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
})();
